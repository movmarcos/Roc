<script>
const lessons={
'01':{module:'Module 01 · Inside AI Coding Assistants',number:'LESSON 1.1',title:'Context is not memory',path:'modules/01-inside-ai-coding-assistants/lessons/01-context-is-not-memory.md'},
'02':{module:'Module 02 · Context Engineering',number:'LESSON 2.1',title:'Build a context architecture',path:'modules/02-context-engineering/lessons/01-build-context-architecture.md'}
};
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function inline(s){let x=esc(s);x=x.replace(/\x60([^\x60]+)\x60/g,'<code>$1</code>');x=x.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');x=x.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|[^\s)]+)\)/g,'<a href="$2">$1</a>');return x}
function md(src){const l=src.replace(/\r/g,'').split('\n');let out='',i=0,list='';function close(){if(list){out+='</'+list+'>';list=''}}while(i<l.length){let s=l[i];if(!s.trim()){close();i++;continue}if(s.startsWith(String.fromCharCode(96).repeat(3))||s.startsWith('~~~')){close();let marker=s.trim()[0];i++;let code=[];while(i<l.length&&!l[i].startsWith(marker.repeat(3)))code.push(l[i++]);i++;out+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';continue}let h=s.match(/^(#{1,6})\s+(.+)$/);if(h){close();let n=h[1].length;out+='<h'+n+'>'+inline(h[2])+'</h'+n+'>';i++;continue}if(/^\s*([-*_]\s*){3,}$/.test(s)){close();out+='<hr>';i++;continue}if(/^\s*>/.test(s)){close();let q=[];while(i<l.length&&/^\s*>/.test(l[i]))q.push(l[i++].replace(/^\s*>\s?/,''));out+='<blockquote>'+q.map(x=>'<p>'+inline(x)+'</p>').join('')+'</blockquote>';continue}if(s.includes('|')&&i+1<l.length&&/^\s*\|?\s*:?-{3,}/.test(l[i+1])){close();let cells=v=>v.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());let heads=cells(s);i+=2;out+='<table><thead><tr>'+heads.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';while(i<l.length&&l[i].includes('|'))out+='<tr>'+cells(l[i++]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';out+='</tbody></table>';continue}let u=s.match(/^\s*[-*+]\s+(.+)/),o=s.match(/^\s*\d+\.\s+(.+)/);if(u||o){let t=u?'ul':'ol';if(list&&list!==t)close();if(!list){list=t;out+='<'+list+'>'}out+='<li>'+inline((u||o)[1])+'</li>';i++;continue}close();let p=[s.trim()];i++;while(i<l.length&&l[i].trim()&&!/^(#{1,6}\s|\x60{3,}|~~~|\s*>|\s*[-*+]\s+|\s*\d+\.\s+)/.test(l[i]))p.push(l[i++].trim());out+='<p>'+inline(p.join(' '))+'</p>'}close();return out}
async function start(){const id=new URLSearchParams(location.search).get('lesson')||'01',m=lessons[id];if(!m){document.getElementById('title').textContent='Lesson not available';document.getElementById('content').innerHTML='<div class="error">This lesson is not available yet. Return to the course sequence to see the material currently in development.</div>';return}document.title=m.title+' · ROC';document.getElementById('moduleName').textContent=m.module;document.getElementById('lessonNo').textContent=m.number;document.getElementById('title').textContent=m.title;document.getElementById('source').href='https://github.com/movmarcos/Roc/blob/main/'+m.path;try{const r=await fetch('./'+m.path);if(!r.ok)throw Error('Lesson source unavailable');let source=await r.text();if(/^\s*<!doctype html|^\s*<html/i.test(source)){const d=new DOMParser().parseFromString(source,'text/html');const body=d.querySelector('.markdown-body')||d.querySelector('main')||d.body;document.getElementById('content').innerHTML=body.innerHTML;const h=body.querySelector('h1');if(h)document.getElementById('title').textContent=h.textContent.replace(/^Lesson\s+\d+\.\d+\s+[—-]\s*/,'')}else{const title=source.match(/^#\s+(.+)$/m);if(title)document.getElementById('title').textContent=title[1].replace(/^Lesson\s+\d+\.\d+\s+[—-]\s*/,'');document.getElementById('content').innerHTML=md(source)}const duration=source.match(/\*\*Estimated duration:\*\*\s*(.+)/);document.getElementById('meta').innerHTML=(duration?'Estimated time · '+esc(duration[1])+' · ':'')+'Draft v0.1 <span class="status">Draft</span>'}catch(e){document.getElementById('content').innerHTML='<div class="error">We could not load this lesson right now. Please try again, or <a href="https://github.com/movmarcos/Roc/tree/main/'+m.path+'">open the source in the repository</a>.</div>'}}start();
</script></body></html>
